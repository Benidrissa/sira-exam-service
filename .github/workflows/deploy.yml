name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sira-exam-service/exam-backend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sira-exam-service/exam-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sira-exam-service/exam-frontend:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sira-exam-service/exam-frontend:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "/home/deploy/sira-exam-service/"

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
          REGISTRY: ghcr.io
          REPO: ${{ needs.build-and-push.outputs.owner }}/sira-exam-service
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SIRA_JWT_SECRET: ${{ secrets.SIRA_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          MINIO_ENDPOINT: ${{ secrets.STAGING_MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          EXAM_ANTHROPIC_API_KEY: ${{ secrets.EXAM_ANTHROPIC_API_KEY }}
          EXAM_WATERMARK_SECRET: ${{ secrets.EXAM_WATERMARK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA,REGISTRY,REPO,GHCR_TOKEN,GHCR_USER,SIRA_JWT_SECRET,DATABASE_URL,REDIS_URL,MINIO_ENDPOINT,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,EXAM_ANTHROPIC_API_KEY,EXAM_WATERMARK_SECRET,SENTRY_DSN
          command_timeout: 30m
          script: |
            set -e
            mkdir -p /home/deploy/sira-exam-service
            cd /home/deploy/sira-exam-service

            # Write .env
            cat > .env <<ENVEOF
            SIRA_JWT_SECRET=${SIRA_JWT_SECRET}
            DATABASE_URL=${DATABASE_URL}
            DATABASE_SCHEMA=exam_svc
            REDIS_URL=${REDIS_URL}
            MINIO_ENDPOINT=${MINIO_ENDPOINT}
            MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
            MINIO_EXAM_BUCKET=exam-evidence
            MINIO_USE_SSL=false
            EXAM_ANTHROPIC_API_KEY=${EXAM_ANTHROPIC_API_KEY}
            EXAM_WATERMARK_SECRET=${EXAM_WATERMARK_SECRET}
            SENTRY_DSN=${SENTRY_DSN}
            NEXT_PUBLIC_EXAM_API_URL=https://sira-exam-api.elearning.portfolio2.kimbetien.com/api/v1
            ENVEOF

            # Pre-deploy DB backup (uses shared etutor postgres container)
            mkdir -p backups
            docker exec etutor-postgres pg_dump -U postgres sira_db 2>/dev/null | gzip > backups/pre-deploy-${SHA}-$(date +%Y%m%d%H%M%S).sql.gz 2>/dev/null || true
            find backups -name "pre-deploy-*.sql.gz" -mtime +7 -delete 2>/dev/null || true

            # Login to ghcr.io on staging server
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull exact SHA images
            docker pull ${REGISTRY}/${REPO}/exam-backend:${SHA}
            docker pull ${REGISTRY}/${REPO}/exam-frontend:${SHA}

            # Tag as latest for compose
            docker tag ${REGISTRY}/${REPO}/exam-backend:${SHA} ${REGISTRY}/${REPO}/exam-backend:latest
            docker tag ${REGISTRY}/${REPO}/exam-frontend:${SHA} ${REGISTRY}/${REPO}/exam-frontend:latest

            cp docker-compose.staging.yml docker-compose.yml

            # Up
            docker compose up -d --remove-orphans

            # Pre-create PostgreSQL ENUM types via psql (bypasses SQLAlchemy/asyncpg CREATE TYPE issues)
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE extractionstatus AS ENUM ('pending','extracting','done','failed'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE bankstatus AS ENUM ('draft','generating','review','published','archived'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE questiontype AS ENUM ('mcq','dissertation'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE difficulty AS ENUM ('easy','medium','hard'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE testmode AS ENUM ('exam','training','review'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE teststatus AS ENUM ('draft','published','archived'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"
            docker exec etutor-postgres psql -U postgres sira_db -c "DO \$b\$ BEGIN CREATE TYPE dissertationstatus AS ENUM ('pending','ai_scored','human_reviewed'); EXCEPTION WHEN duplicate_object THEN NULL; END \$b\$;"

            # Migrations
            docker compose run --rm backend alembic upgrade head

            # Force-recreate backend to pick up env changes
            docker compose up -d --force-recreate backend

            # Health check — use direct container IP to bypass Traefik TLS (LE cert may not be ready)
            sleep 20
            BACKEND_IP=$(docker inspect sira-exam-service-backend-1 --format '{{.NetworkSettings.Networks.proxy.IPAddress}}')
            curl -sf "http://${BACKEND_IP}:8001/health" || \
              (echo "Health check failed — rolling back to previous sha" && \
               docker compose down && exit 1)

            echo "Staging deploy complete: ${SHA} @ $(date)"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "/home/deploy/sira-exam-service/"

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
          REGISTRY: ghcr.io
          REPO: ${{ needs.build-and-push.outputs.owner }}/sira-exam-service
          SIRA_JWT_SECRET: ${{ secrets.PROD_SIRA_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          EXAM_ANTHROPIC_API_KEY: ${{ secrets.EXAM_ANTHROPIC_API_KEY }}
          EXAM_WATERMARK_SECRET: ${{ secrets.PROD_EXAM_WATERMARK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          envs: SHA,REGISTRY,REPO,SIRA_JWT_SECRET,DATABASE_URL,REDIS_URL,MINIO_ENDPOINT,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,EXAM_ANTHROPIC_API_KEY,EXAM_WATERMARK_SECRET,SENTRY_DSN
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/sira-exam-service

            cat > .env <<ENVEOF
            SIRA_JWT_SECRET=${SIRA_JWT_SECRET}
            DATABASE_URL=${DATABASE_URL}
            DATABASE_SCHEMA=exam_svc
            REDIS_URL=${REDIS_URL}
            MINIO_ENDPOINT=${MINIO_ENDPOINT}
            MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
            MINIO_EXAM_BUCKET=exam-evidence
            MINIO_USE_SSL=false
            EXAM_ANTHROPIC_API_KEY=${EXAM_ANTHROPIC_API_KEY}
            EXAM_WATERMARK_SECRET=${EXAM_WATERMARK_SECRET}
            SENTRY_DSN=${SENTRY_DSN}
            NEXT_PUBLIC_EXAM_API_URL=https://sira-exam-api.sira-donnia.org/api/v1
            ENVEOF

            docker pull ${REGISTRY}/${REPO}/exam-backend:${SHA}
            docker pull ${REGISTRY}/${REPO}/exam-frontend:${SHA}
            docker tag ${REGISTRY}/${REPO}/exam-backend:${SHA} ${REGISTRY}/${REPO}/exam-backend:latest
            docker tag ${REGISTRY}/${REPO}/exam-frontend:${SHA} ${REGISTRY}/${REPO}/exam-frontend:latest

            cp docker-compose.staging.yml docker-compose.yml
            docker compose up -d --remove-orphans
            docker compose run --rm backend alembic upgrade head
            docker compose up -d --force-recreate backend

            sleep 10
            curl -sf https://sira-exam-api.sira-donnia.org/health || \
              (echo "Health check failed" && docker compose down && exit 1)

            echo "Production deploy complete: ${SHA} @ $(date)"
