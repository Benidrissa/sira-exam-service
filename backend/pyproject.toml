[project]
name = "sira-exam-service"
version = "0.1.0"
description = "Sira Exam Service — AI-generated proctored exams for university accreditation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.86.0",
    "aiobotocore>=2.13.0",
    "botocore>=1.35.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.22",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.42.0",
    "sentry-sdk[fastapi]>=2.19.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "B904", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"app/api/**" = ["E501"]
"app/tasks/**" = ["E501"]
# Domain models: E501 for long FK/relationship lines; UP042 deferred (str+Enum is intentional
# for SQLAlchemy Enum column compatibility — StrEnum behaves identically in Py3.12 but changing
# existing scaffold enums is a separate cleanup task).
"app/domain/models/**" = ["E501", "UP042"]
"app/infrastructure/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
